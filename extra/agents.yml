system:
  name: "Open web UI"

# Switch provider here and set the matching key in .env — nothing else in
# this file names a vendor. For a local Ollama model instead of a paid key,
# use provider: openai, name: qwen2.5:14b (or whatever you've pulled), and
# see the Ollama comment in .env.example.
defaults:
  model:
    provider: anthropic
    name: claude-haiku-4-5
    temperature: 0.0

plugins:
  import_roots:
    - "."

hooks:
  on_run_start:
    - plugin: "run_token"
      method: "on_run_start"
      # No run without a fresh credential — a run that continued here would
      # act with no identity at all.
      failure_policy: fail

resolvers:
  # Fills {{admin_routing}} in the root orchestrator's prompt — see
  # plugins/resolvers/openwebui.py.
  admin_routing:
    scope: agent

tools:
  add_new_user:
    description: Adding new user to the system
  all_user_details:
    description: Get list of all users details
  delete_specific_user:
    description: Delete specific user
  list_of_groups:
    description: List of all groups
  create_group:
    description: Creating new group
  add_user_to_group:
    description: add specific user to group

orchestrators:
  openwebui:
    resolvers: [admin_routing]
    prompts:
      orchestrator: "prompts/openwebui_orchestrator/orchestrator.md"
      system: "prompts/openwebui_orchestrator/system.md"
  admin_management:
    prompts:
      orchestrator: "prompts/admin_management/orchestrator.md"
      system: "prompts/admin_management/system.md"
    # Hidden from routing entirely unless plugins/access.py says otherwise —
    # not just refused after the model reaches for it. See plugins/access.py.
    protected: true

agents:
  user_management:
    description: Handling user management operations and details
    prompts:
      system: "prompts/user_management/system.md"
    tools: [add_new_user, all_user_details, delete_specific_user]
    auto: true
  group_management:
    description: Group management [user is user id not name and uuid]
    prompts:
      system: "prompts/group_management/system.md"
    tools: [list_of_groups, create_group, add_user_to_group]
    auto: true

graph:
  openwebui:
    admin_management:
      user_management:
      group_management:
