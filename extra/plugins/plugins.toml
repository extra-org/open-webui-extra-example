# plugins.toml — unified manifest for this client extension package.
#
# ONE manifest for ALL client extension code: hooks, resolvers, and tools.
# It is a catalog/generation companion. The runtime reads only [hooks.plugins]
# to resolve managed hook ids; resolvers and tools load by file path.
# `agentctl generate` creates this file if missing and merges new entries in
# without overwriting manual edits.
#
# SECURITY: never put secrets here. Only import refs and metadata — no tokens,
# client secrets, HMAC keys, or Authorization values.

[package]
name = "plugins"
description = "Client extension package for hooks, resolvers, and tools."

[paths]
hooks = "plugins.hooks"
resolvers = "plugins.resolvers"
tools = "plugins.tools"

[hooks]
on_engine_start = []
on_engine_stop = []
on_run_start = ["run_token"]
on_run_end = []
on_run_error = []
before_tool_call = []
after_tool_call = []
transform_tool_result = []
on_tool_error = []
before_mcp_request = []
after_mcp_response = []

[hooks.plugins]
run_token = "plugins.hooks.run_token:RunTokenHook"

[resolvers]

[tools]
add_new_user = "plugins.tools.add_new_user:add_new_user"
add_user_to_group = "plugins.tools.add_user_to_group:add_user_to_group"
all_user_details = "plugins.tools.all_user_details:all_user_details"
create_group = "plugins.tools.create_group:create_group"
delete_specific_user = "plugins.tools.delete_specific_user:delete_specific_user"
list_of_groups = "plugins.tools.list_of_groups:list_of_groups"
